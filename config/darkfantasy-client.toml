
#Замена экранов меню
[menu]
	#Заменять главное меню игры на меню в стиле дарк-фентези
	replaceMainMenu = true
	#Заменять экран паузы (ESC) на тёмную версию
	replacePauseScreen = true
	#Заменять инвентарь (E) на RPG-версию с бронёй, зеркалом персонажа и печатью рун
	replaceInventory = true
	#Переносить кнопки других модов (FancyMenu, Reconnect и т.п.) с ванильных
	# экранов на наши тёмные меню. Отключите, если чужие кнопки конфликтуют.
	mergeVanillaButtons = true
	#Кнопки других модов, попавшие с ванильных координат на RPG-инвентарь,
	# выстраиваются в рунный ряд над панелью. Кнопка Curios всегда
	# скрывается — вместо неё работает своя амулет-кнопка в углу панели.
	moveForeignButtons = true
	#Если установлен FancyMenu — не перехватывать главное меню и паузу,
	# чтобы два перехватчика не воевали друг с другом. Наша интеграция
	# кнопок (mergeVanillaButtons) при этом продолжает работать.
	yieldToFancyMenu = false
	#Заменять экран смерти на тёмный: рунный круг, надпись «Ты погиб»,
	# причина смерти и кнопки по центру тьмы
	replaceDeathScreen = true
	#Чёрный список: namespace модов, чьи контейнеры RPG-система не трогает.
	# Годится для технических GUI (mekanism, appliedenergistics2, powah,
	# thermal и т.п.), если что-то в них ломается.
	screenBlacklist = ["mekanism", "appliedenergistics2", "powah", "thermal", "thermal_expansion", "immersiveengineering"]
	#Заменять экран чародейского стола на тёмный в стиле ABYSS:
	# том с рунным кругом, пластины зачарований, стоимость опытом.
	# Логика чар не меняется — только оформление
	replaceEnchantTable = true
	#Перекрашивать кнопки ЛЮБЫХ экранов (ваниль и чужие моды: JEI, Curios,
	# FancyMenu и т.д.) в тёмный стиль: панель-обёртка и насыщенный
	# непрозрачный текст. Кнопки без текста (иконки) не трогаются
	styleAllButtons = true
	#Накладывать лёгкую тёмно-фиолетовую пелену на фон ЛЮБЫХ экранов
	# (ваниль и моды сборки), чтобы все интерфейсы выглядели единым
	# целым. Свои экраны мода и чат не трогаются
	tintAllScreens = true

#Настройки игрового HUD
[hud]
	#Тёмно-фиолетовая виньетка по краям экрана во время игры
	showVignette = true
	#Тонкая фиолетовая рамка вокруг хотбара
	hotbarFrame = true
	#Прицел-сигил: медленно вращающийся рунный узел; при наведении на
	# существо вспыхивает бирюзой
	sigilCrosshair = true
	#Полоса опыта как поток душ: бирюзово-фиолетовое свечение,
	# уровень светится над полосой
	soulXpBar = true
	#Кровавая пульсация по краям экрана, когда здоровья меньше трети
	lowHealthPulse = true
	#Алые края экрана, пока активен босс, затемняющий небо
	# (Дракон Края, Иссушитель, боссы Cataclysm и др.)
	bossVignette = true
	#Полоса жизни боссов в стиле дарк-фентези: рунная рамка,
	# фиолетовое заполнение с бирюзовой нитью, искра на кончике
	# и имя босса над полосой. Ванильная полоса при этом
	# отключается; если прочитать события боссов не удастся,
	# мод сам вернёт ванильную полосу (босс не останется без полосы)
	themeBossBar = true

#Экраны загрузки мира
[loading]
	#Заменять экран «Загрузка мира» (полоса прогресса при входе в мир
	# и создании нового) на тёмную версию: рунный круг, поток душ и проценты
	replaceWorldLoading = false
	#Заменять экран «Загрузка данных мира» (короткое ожидание чанков
	# после входа) на тёмную версию «мир проявляется из тьмы»
	replaceTerrainScreen = false

#Интеграции и дополнительные эффекты
[extras]
	#Звуки интерфейса: щелчки и мягкие аккорды при клике и наведении на кнопки
	uiSounds = true
	#Тёмная подложка и стилизация чата
	darkChat = true
	#Искры и вспышки при подборе лута и опыта
	lootSparks = true
	#Собственный рендерер полосы жизни боссов в тёмной теме
	darkBossBar = true
	#Рамка-декор вокруг контейнеров (сундуки, печи, машины модов)
	containerFrame = true
	#Декор экранов Puffish Skills
	puffishDecor = true
	#Полоса маны Ars Nouveau в стиле мода
	arsManaBar = true
	#Тинт иконок предметов по их качеству/редкости
	qualityTint = true

